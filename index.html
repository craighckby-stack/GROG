<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Google AI Studio App</title>
    <!-- 
      ARCHITECTURAL HEADER:
      This file serves as the root entry point for the application.
      It integrates the diagnostic telemetry lifecycle to ensure 
      system integrity and performance monitoring from the first paint.
      
      Mutation: Integrated diagnostic-init.ts to gate application mount
      based on system health telemetry. Added DiagnosticOrchestrator 
      hook to prevent UI rendering until kernel validation is complete.
    -->
    <script type="module">
      import { initDiagnosticContext } from '/src/lib/diagnostic-init.ts';
      
      // Initialize diagnostic gate
      window.__DIAGNOSTIC_GATE__ = new Promise((resolve) => {
        try {
          const report = initDiagnosticContext();
          if (report?.summary?.is_healthy) {
            resolve(true);
          } else {
            console.warn('[DIAGNOSTIC] System degraded, proceeding with caution.');
            resolve(true);
          }
        } catch (e) {
          console.error('[DIAGNOSTIC] Initialization failed:', e);
          resolve(false);
        }
      });

      window.__DIAGNOSTIC_GATE__.then((isReady) => {
        const root = document.getElementById('root');
        if (root) {
          root.setAttribute('data-diagnostic-ready', isReady ? 'true' : 'error');
        }
      });
    </script>
    <style>
      #root[data-diagnostic-ready="false"] {
        opacity: 0;
        pointer-events: none;
      }
      #root[data-diagnostic-ready="true"] {
        opacity: 1;
        transition: opacity 0.3s ease-in;
      }
      #root[data-diagnostic-ready="error"] {
        opacity: 1;
        border: 2px solid red;
      }
    </style>
  </head>
  <body>
    <div id="root" data-diagnostic-ready="false"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
